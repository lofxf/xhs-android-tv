name: Build 小红书TV (FongMi repack)

# 基于 FongMi 官方发布的 leanback-armeabi_v7a.apk 重新打包：
# 包名 com.fongmi.android.tv.xhs（与原版并存）、应用名「小红书TV」、独立图标/横幅。
# FongMi 源码依赖作者自建、未公开的 mpv/ffmpeg 预编译库，无法直接从源码编译，所以采用重打包。
on:
  push:
    branches: [main]
    paths: ["fongmi/**", ".github/workflows/fongmi.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APKTOOL_VERSION: "2.12.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download FongMi + apktool
        run: |
          VERSION="$(cat fongmi/VERSION)"
          mkdir -p work
          curl -fsSL -o work/original.apk "https://github.com/FongMi/Release/releases/download/${VERSION}/leanback-armeabi_v7a.apk"
          curl -fsSL -o work/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          sha256sum work/original.apk work/apktool.jar
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Decode + patch
        run: |
          java -jar work/apktool.jar d -f -o work/decoded work/original.apk
          python3 fongmi/repack.py work/decoded fongmi/res

      - name: Rebuild
        run: java -jar work/apktool.jar b -o work/unsigned.apk work/decoded

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.FONGMI_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FONGMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FONGMI_KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用仓库 Secrets 中的固定签名证书"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.ks"
          else
            echo "::warning::未设置 FONGMI_KEYSTORE_BASE64，使用临时签名证书，升级前需卸载旧版"
            KEYSTORE_PASS="$(openssl rand -hex 16)"
            KEY_ALIAS=xhstv
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.ks" -storetype PKCS12 -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=XhsTV sideload"
          fi
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 work/unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.ks" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEYSTORE_PASS" \
            --out out/XhsTV-leanback-armeabi-v7a.apk work/aligned.apk
          "$BT/apksigner" verify --print-certs out/XhsTV-leanback-armeabi-v7a.apk | head -3
          "$BT/aapt2" dump badging out/XhsTV-leanback-armeabi-v7a.apk | grep -E "^package:|application-label:|leanback" | head -5
          rm -f "$RUNNER_TEMP/release.ks"

      - uses: actions/upload-artifact@v4
        with:
          name: XhsTV-leanback-armeabi-v7a
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fongmi-xhs
          name: 小红书TV（FongMi ${{ env.VERSION }} 改版）
          make_latest: false
          body: |
            基于 FongMi ${{ env.VERSION }} 官方 leanback-armeabi_v7a 重新打包，可与原版 FongMi 并存（包名 `com.fongmi.android.tv.xhs`）。
            应用名「小红书TV」，独立图标与 Fire TV 横幅。首次打开后在「设置 → 点播」填入：
            `https://raw.githubusercontent.com/${{ github.repository }}/dist/config.json`
          files: out/*.apk
