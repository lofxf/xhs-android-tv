name: Build spider jar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build custom_spider.jar
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --no-daemon :spider:spiderJar
          ls -la dist
          unzip -l dist/custom_spider.jar

      - uses: actions/upload-artifact@v4
        with:
          name: tvsource-dist
          path: dist/

      # main 分支：把 dist/ 发布到 dist 分支，供 FongMi/TV 直接填写配置地址
      - name: Publish to dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/custom_spider.jar
            dist/config.json
