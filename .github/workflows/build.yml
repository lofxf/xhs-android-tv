name: Build spider jar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build custom_spider.jar
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --no-daemon :spider:spiderJar
          ls -la dist
          unzip -l dist/custom_spider.jar

      - uses: actions/upload-artifact@v4
        with:
          name: tvsource-dist
          path: dist/

      # 一次性合并：main 上还没有 merged.json 时，合并饭太硬配置 + 本仓库站点（之后保持不变，可手动运行 merge-once 更新）
      - name: One-time merge (饭太硬 + 小红书/B站)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('merged.json') == ''
        continue-on-error: true
        run: |
          pip install --user --break-system-packages pycryptodome || pip install pycryptodome || true
          python3 tools/merge_once.py "http://www.饭太硬.net/tv" config.template.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist/custom_spider.jar" merged.json
          cp merged.json dist/merged.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged.json
          git commit -m "Add merged.json (one-time merge of 饭太硬 config)"
          git push origin HEAD:main

      # main 分支：把 dist/ 发布到 dist 分支，供 FongMi/TV 直接填写配置地址
      - name: Publish to dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/custom_spider.jar
            dist/config.json
